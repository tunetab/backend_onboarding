databaseChangeLog:
  - changeSet:
      id: insert_superadmin_to_users
      author: lzezulya@icerockdev.com
      changes:
        - insert:
            tableName: users
            columns:
              - column:
                  name: id
                  valueComputed: gen_random_uuid()
              - column:
                  name: email
                  value: '#{ADMIN_EMAIL}'
              - column:
                  name: phone
                  value: '#{ADMIN_PHONE}'
              - column:
                  name: password
                  value: '#{ADMIN_PASSWORD_HASH}'
              - column:
                  name: role
                  value: SUPERADMIN
              - column:
                  name: status
                  value: ACTIVE
              - column:
                  name: is_test
                  valueBoolean: false
              - column:
                  name: created_at
                  valueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  valueComputed: CURRENT_TIMESTAMP
      rollback:
        - sql:
            sql: DELETE FROM users WHERE email = '#{ADMIN_EMAIL}' AND phone = '#{ADMIN_PHONE}' AND role = 'SUPERADMIN';
