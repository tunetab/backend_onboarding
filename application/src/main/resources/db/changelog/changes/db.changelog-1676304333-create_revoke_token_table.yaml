databaseChangeLog:
  - changeSet:
      id: create_revoke_token_table
      author: atamarov@icerockdev.com
      changes:
        - createTable:
            tableName: revoke_token
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: entity_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: entity_type
                  type: varchar
                  constraints:
                    nullable: false
              - column:
                  name: expired_at
                  type: timestamp
                  constraints:
                    nullable: false

      rollback:
        - sql:
            sql: DROP TABLE revoke_token;
