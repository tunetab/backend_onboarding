spring:
  profiles:
    default: dev
  aop:
    auto: true
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:db}
    username: ${DATABASE_USER:user}
    password: ${DATABASE_PASS:pass}
    hikari:
      connection-init-sql: ${DATABASE_INITSQL:}
      schema: ${DATABASE_SCHEMA:public}
      idle-timeout: ${DATABASE_TIMEOUT:600000}
      maximum-pool-size: ${DATABASE_POOL_SIZE:5}
  jpa:
    hibernate.ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
      allowed-methods: ${CORS_ALLOWED_METHODS}
      max-age: ${CORS_MAX_AGE}
      allowed-headers: ${CORS_ALLOWED_HEADERS}
      exposed-headers: ${CORS_EXPOSED_HEADERS}
    resources:
      add-mappings: false
springdoc:
  api-docs:
    path: /swagger-ui/api-docs
jwt:
  secret: ${JWT_SECRET}
  audience: ${JWT_AUDIENCE}
  issuer: ${JWT_ISSUER}
  access-token-ttl: ${JWT_ACCESS_TOKEN_TTL}
  refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL}
server:
  address: ${SERVER_HOST}
  port: ${SERVER_PORT}
  error:
    whitelabel:
      enabled: false
api:
  base-url: ${API_BASE_URL}
  admin-url: ${ADMIN_BASE_URL}
logging:
  level:
    root: INFO
