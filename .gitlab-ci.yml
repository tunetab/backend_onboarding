### Development make java
Development make java:
  extends:
    - .make_java_template
    - .only_dev_definition
  variables:
    BUILD_ENV: 'dev'
  dependencies:
    - Development init
    - Development build java
  needs:
    - Development init
    - Development build java

### Staging make java
Staging make java:
  extends:
    - .make_java_template
    - .only_stage_definition
  variables:
    BUILD_ENV: 'stage'
  dependencies:
    - Staging init
    - Staging build java
  needs:
    - Staging init
    - Staging build java

### Production make java
Production make java:
  extends:
    - .make_java_template
    - .only_prod_definition
  variables:
    BUILD_ENV: 'prod'
  dependencies:
    - Production init
    - Production build java
  needs:
    - Production init
    - Production build java

### Development deploy
Development deploy:
  extends:
    - .deploy_template
    - .only_dev_definition
  variables:
    BUILD_ENV: 'dev'
  dependencies:
    - Development init

### Staging deploy
Staging deploy:
  extends:
    - .deploy_template
    - .only_stage_definition
  variables:
    BUILD_ENV: 'stage'
  dependencies:
    - Staging init

### Production deploy
Production deploy:
  extends:
    - .deploy_template
    - .only_prod_definition
  variables:
    BUILD_ENV: 'prod'
  dependencies:
    - Production init
