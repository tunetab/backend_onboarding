variables:
  DOCKER_DRIVER: overlay2
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""
  GIT_STRATEGY: fetch
  GIT_SUBMODULE_STRATEGY: recursive
  DOCKER_BUILD_IMAGE: docker:latest
  DOCKER_DIND_IMAGE: docker:dind
  NGINX_BUILD_IMAGE: gitlab.icerockdev.com:4567/docker/nginx/nginx-alpine:latest
  JAVA_BUILD_IMAGE: gitlab.icerockdev.com:4567/docker/java/openjdk-slim-21:21.0.2_13-jdk-slim-0.1
  #  NODEJS_BUILD_IMAGE: gitlab.icerockdev.com:4567/docker/node/node-18.16:latest
  ENVIRONMENT_DIR: docker/environment
  SYNC_FOLDER: docker/sync
  JAVA_VERSION_TAG: java21
  ARCHIVE_INIT: init.tar.gz
  #  ARCHIVE_ADMIN: admin.build.tar.gz
  ARCHIVE_JAR: app.build.tar.gz

stages:
  - lint
  - init
  - build
  - make-image
  - deploy

# TODO: include from configuration repo - https://gitlab.icerockdev.com/web/configuration/ci-templates
include:
  - local: '/ci-templates/.0-common.yml'

  - project: 'web/configuration/ci-templates'
    ref: 'master'
    file: '/kotlin/spring/lint.gitlab-ci.yml'

  - project: 'web/configuration/ci-templates'
    ref: 'master'
    file: '/openapi/openapi-lint.gitlab-ci.yml'

  - local: '/ci-templates/.2-init-stage.yml'

  - project: 'web/configuration/ci-templates'
    ref: 'master'
    file: '/kotlin/spring/build.gitlab-ci.yml'

  # TODO: Uncomment when init frontend app (in frontend/ path)
  #  - project: 'web/configuration/ci-templates'
  #    ref: 'master'
  #    file: '/frontend/build.gitlab-ci.yml'

  - project: 'web/configuration/ci-templates'
    ref: 'master'
    file: '/kotlin/make-image.gitlab-ci.yml'

  - project: 'web/configuration/ci-templates'
    ref: 'master'
    file: '/nginx/make-image.gitlab-ci.yml'

  - project: 'web/configuration/ci-templates'
    ref: 'master'
    file: '/deploy/deploy.gitlab-ci.yml'

# TODO: Switch to shell-executor when java21 becomes available
lint:
  image: ${JAVA_BUILD_IMAGE}
  stage: lint
  services:
    - name: docker:dind
      command: ["--tls=false"]
  tags:
    - fast
    - docker-dind
  script:
    - export GRADLE_USER_HOME=`pwd`/.gradle
    - mkdir -p .gradle
    - ./gradlew clean
    - ./gradlew build

### Development build java
Development build java:
  extends:
    - .build-java
    - .only_dev_definition

### Staging build java
Staging build java:
  extends:
    - .build-java
    - .only_stage_definition

### Production build java
Production build java:
  extends:
    - .build-java
    - .only_prod_definition

