databaseChangeLog:
  - changeSet:
      id: create_push_tokens_table
      author: author@email.com
      changes:
        - createTable:
            tableName: push_tokens
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: entity_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: token
                  type: varchar
                  constraints:
                    nullable: false
      rollback:
        - sql:
            sql: DROP TABLE push_tokens;
