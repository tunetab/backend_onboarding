version: '3'
services:

  postgres:
    restart: always
    image: ${IMAGE_POSTGRES}
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASS}
    ports:
      - "${DATABASE_HOST}:5432:5432"
    volumes:
      - postgresql-data:/var/lib/postgresql/data

  rustfs:
    image: ${IMAGE_RUSTFS}
    restart: always
    logging: &logging
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    ports:
      - "${S3_HOST}:9000:9000"
      - "${S3_HOST}:9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - rustfs-data:/data

volumes:
  postgresql-data:
    driver: local
  rustfs-data:
    driver: local
