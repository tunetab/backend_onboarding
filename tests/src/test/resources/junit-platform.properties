# This enables us to ask JUnit to create only one instance of the test class and reuse it between tests.
# See https://www.baeldung.com/junit-testinstance-annotation
junit.jupiter.testinstance.lifecycle.default = per_class
# https://junit.org/junit5/docs/current/user-guide/#running-tests-ide
junit.jupiter.execution.parallel.enabled = true
junit.jupiter.execution.parallel.mode.default = concurrent
junit.jupiter.execution.parallel.mode.classes.default = same_thread
